<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raw</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b0b0d;color:#fff;font:16px system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:auto;position:relative}
#me{position:absolute;top:calc(10px + env(safe-area-inset-top));left:14px;z-index:5;font-size:12px;opacity:.7;text-shadow:0 1px 4px #000;pointer-events:none}
main{flex:1;position:relative;overflow:auto}
nav{display:flex;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px;background:none;border:0;color:#777;font-size:15px}
nav button.on{color:#fff;font-weight:600}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter .25s;background:#000}
#cam.back{transform:none}
#cam.blur{filter:blur(28px) brightness(.8)}
#flip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:22px}
.rec{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
#rb{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#e33;transition:.2s}
#rb.go{border-radius:18px;transform:scale(.7)}
#bar{position:absolute;top:0;left:0;height:4px;background:#e33;width:0}
#hint{font-size:13px;opacity:.8;text-shadow:0 1px 4px #000}
.sheet{position:absolute;z-index:3;inset:0;background:#0b0b0dee;display:none;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;text-align:center}
.sheet.on{display:flex}
.row{display:flex;gap:10px}
.chip{padding:12px 18px;border-radius:99px;border:1px solid #444;background:none;color:#fff;font-size:15px}
.chip.on{background:#fff;color:#000}
.btn{padding:14px 28px;border-radius:99px;border:0;background:#fff;color:#000;font-weight:700;font-size:16px}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#16161a;color:#fff;font-size:16px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#16161a;border-radius:12px}
.item button{padding:8px 14px;border-radius:99px;border:0;background:#fff;color:#000;font-weight:600}
h3{font-size:13px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
#view{position:fixed;inset:0;background:#000;display:none;z-index:9}
#view video{width:100%;height:100%;object-fit:cover}
#vt{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:14px;opacity:.8;text-shadow:0 1px 6px #000}
#land{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px;text-align:center}
#land video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#lt,#lgo{position:relative;z-index:2}#lt{font-size:22px;font-weight:700;text-shadow:0 1px 8px #000}
</style>
<script>
!function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register identify reset opt_out_capturing opt_in_capturing startSessionRecording stopSessionRecording".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
posthog.init('phc_qJWqtKSqrCvpAurqjYjNjNbf9LaeAQwsSRonhUxxZFXG',{
  api_host:'https://us.i.posthog.com',
  person_profiles:'identified_only',
  autocapture:false,
  session_recording:{
    maskAllInputs:true,
    maskTextSelector:'*',
    blockSelector:'video, audio, img, canvas'
  }

</script>
</head><body>
<div id="app">
  <div id="me"></div>
  <main>
    <section id="t-cam" style="height:100%">
      <video id="cam" autoplay muted playsinline></video><div id="bar"></div><button id="flip" aria-label="Flip camera">&#x21BB;</button>
      <div class="rec"><span id="hint">Tap to record · up to 30s · you're blurred while recording</span><button id="rb"></button></div>
      <div class="sheet" id="sh">
        <h3 style="margin:0">Deleted after</h3>
        <div class="row" id="timers"><button class="chip" data-t="30">30 min</button><button class="chip on" data-t="120">2 hr</button><button class="chip" data-t="360">6 hr</button></div>
        <button class="btn" id="send">Send to friends</button>
        <button class="chip" id="trash">Discard</button>
        <span id="msg" style="font-size:14px;opacity:.8"></span>
      </div>
    </section>
    <section id="t-fr" class="pad" style="display:none;padding-top:36px">
      <h3>Friends</h3>
      <div id="fl" class="pad" style="padding:0"></div>
      <h3>Videos</h3>
      <div id="inb" class="pad" style="padding:0"></div>
      <h3>Reactions</h3>
      <div id="rxl" class="pad" style="padding:0"></div>
      <h3>Find friends</h3>
      <input id="q" placeholder="Search by name" autocomplete="off">
      <div id="res" class="pad" style="padding:0"></div>
      <h3>Invite</h3>
      <div class="item"><span style="font-size:13px;opacity:.8">Record 8s. They watch it first.</span><button id="mkinv">Record</button></div>
      <div class="item" id="linkrow" style="display:none"><span id="invtxt" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%"></span><button id="copy">Copy link</button></div>
    </section>
  </main>
  <nav><button id="n-cam" class="on">Camera</button><button id="n-fr">Friends</button></nav>
</div>
<div id="land"><video id="lv" playsinline></video><div id="lt"></div><button class="btn" id="lgo"></button></div>
<div id="pre" class="sheet" style="position:fixed;z-index:15">
<h3 style="margin:0">Before you watch</h3>
<div class="row"><button class="chip" id="rx1">Reaction on</button><button class="chip" id="rx0">Reaction off</button></div>
<button class="btn" id="go">Watch</button>
<button class="chip" id="no">Cancel</button>
</div>
<div id="rv" class="sheet" style="position:fixed;z-index:16">
<h3 style="margin:0">Your reaction · last 5s</h3>
<video id="rvv" playsinline loop style="width:70%;max-height:50%;border-radius:16px;background:#000;transform:scaleX(-1)"></video>
<button class="btn" id="rvs">Send reaction</button>
<button class="chip" id="rvx">Delete</button>
<span id="rvm" style="font-size:14px;opacity:.8"></span>
</div>
<div id="view"><video playsinline></video><div id="vt">Tap to close</div></div>
<script>
const $=s=>document.querySelector(s);
const HINT=$('#hint').textContent;let lim=30000,invMode=false;
let RX=localStorage.getItem('rx')!=='0',pend=null; // reaction on/off, remembered on this phone
let face=localStorage.getItem('face')==='environment'?'environment':'user'; // which camera: user = front, environment = back
let rt0=0,recDur=0,RXC=null; // recording start time, clip length in seconds, reaction waiting to be sent
let FC=0; // friend count: decides between "send to friends" and "get share link"
let S=JSON.parse(localStorage.getItem('raw')||'null'),ttl=120,blob=null,stream,mr,chunks=[],tick;
const api=(p,o)=>fetch('/api/'+p,o).then(r=>r.json());
const key=()=>'key='+S.key;
const dead=()=>{localStorage.removeItem('raw');location.reload()}; // server forgot this login: start fresh

function landing(c){return new Promise(async res=>{
  const info=await api('invite_info?c='+encodeURIComponent(c)).catch(()=>({}));
  if(!info.name)return res(null);
  const L=$('#land'),v=$('#lv'),go=$('#lgo'),t=$('#lt');
  L.style.display='flex';t.textContent=info.name+' sent you something';go.textContent='Tap to watch';
  go.onclick=async()=>{
    go.style.display='none';t.textContent='';
    const r=await fetch('/api/invite_clip?c='+encodeURIComponent(c));
    if(!r.ok){L.style.display='none';return res(null)}
    const url=URL.createObjectURL(await r.blob());let fin=false;
    const done=()=>{
      if(fin)return;fin=true;v.pause();v.style.display='none';URL.revokeObjectURL(url);
      t.textContent='Send one back to '+info.name;go.textContent='Record your reply';go.style.display='';
      go.onclick=()=>{L.style.display='none';res(info)};
    };
    v.src=url;v.style.display='block';v.onended=done;v.onclick=done;v.play().catch(done);
  };
})}
function endInv(){invMode=false;lim=30000;$('#timers').style.display='';$('#send').textContent='Send to friends';$('#hint').textContent=HINT}
async function boot(){
  const c=new URLSearchParams(location.search).get('c');
  const info=c?await landing(c):null;
  if(!S){
    const name=(prompt('Pick a name your friends will recognize')||'').trim();
    if(!name)return location.reload();
    S=await api('join?name='+encodeURIComponent(name)+(info?'&c='+encodeURIComponent(c):''));
    localStorage.setItem('raw',JSON.stringify(S));
  }else if(info){await api('claim?'+key()+'&c='+encodeURIComponent(c))}
  if(c)history.replaceState(0,'','/');
  $('#me').textContent='You: '+S.name;
  tab('cam');startCam();refresh();setInterval(refresh,8000);
  if(info)$('#hint').textContent='Send one back to '+info.name+' · tap to record';
}
async function startCam(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face}},audio:true});
    $('#cam').srcObject=stream;
    $('#cam').classList.toggle('back',face==='environment');
  }catch(e){$('#hint').textContent='Allow camera + mic to continue'}
}
$('#flip').onclick=async()=>{
  if(mr&&mr.state=='recording')return;
  face=face==='user'?'environment':'user';
  localStorage.setItem('face',face);
  await startCam();
};
function tab(t){
  $('#t-cam').style.display=t=='cam'?'block':'none';
  $('#t-fr').style.display=t=='fr'?'flex':'none';
  $('#n-cam').classList.toggle('on',t=='cam');$('#n-fr').classList.toggle('on',t=='fr');
  if(t=='fr')refresh();
}
$('#n-cam').onclick=()=>{endInv();tab('cam')};$('#n-fr').onclick=()=>{endInv();tab('fr')};

$('#rb').onclick=()=>{
  if(mr&&mr.state=='recording')return mr.stop();
  if(!stream)return startCam();
  chunks=[];
  const type=MediaRecorder.isTypeSupported('video/webm')?'video/webm':'video/mp4';
  mr=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:1500000});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{
    recDur=Math.round((Date.now()-rt0)/1000);
    clearInterval(tick);$('#bar').style.width=0;
    $('#rb').classList.remove('go');$('#cam').classList.remove('blur');
    blob=new Blob(chunks,{type});$('#sh').classList.add('on');$('#msg').textContent='';
    // no friends yet: skip the pointless upload-to-friends and offer a share link instead
    if(!invMode){$('#send').textContent=FC?'Send to friends':'Get share link';$('#timers').style.display=FC?'':'none'}
  };
  mr.start();$('#rb').classList.add('go');if(face==='user')$('#cam').classList.add('blur');
  rt0=Date.now();const t0=rt0;
  tick=setInterval(()=>{
    const p=(Date.now()-t0)/lim;$('#bar').style.width=Math.min(p,1)*100+'%';
    if(p>=1)mr.stop();
  },100);
};
document.querySelectorAll('#timers .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#timers .chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');ttl=+b.dataset.t;
});
$('#trash').onclick=()=>{blob=null;$('#sh').classList.remove('on')};
$('#mkinv').onclick=()=>{invMode=true;lim=8000;$('#timers').style.display='none';$('#send').textContent='Make invite link';tab('cam');$('#hint').textContent='Record your invite · 8s · tap to start'};
$('#send').onclick=async()=>{
  $('#msg').textContent='Sending…';
  if(invMode||FC===0){
    const r=await fetch('/api/invite?'+key(),{method:'POST',headers:{'Content-Type':blob.type},body:blob}).then(r=>r.json()).catch(()=>({}));
    if(r.error==='auth')return dead();
    if(!r.c){$('#msg').textContent=r.error||'Try again';return}
    const link=location.origin+'/?c='+r.c;
    blob=null;$('#sh').classList.remove('on');endInv();
    $('#invtxt').textContent=link;$('#linkrow').style.display='flex';tab('fr');
    try{if(navigator.share)await navigator.share({text:'Watch this',url:link});else await navigator.clipboard.writeText(link)}catch(e){}
    return;
  }
  const r=await fetch('/api/send?'+key()+'&ttl='+ttl+'&d='+recDur,{method:'POST',headers:{'Content-Type':blob.type},body:blob}).then(r=>r.json()).catch(()=>({}));
  if(r.error==='auth')return dead();
  if(!r.sent){$('#msg').textContent=r.error==='no friends'?'Add a friend first':'Try again';return}
  blob=null;$('#sh').classList.remove('on');
};

const fmt=m=>m>=60?Math.ceil(m/60)+'h':m+'m';
async function refresh(){
  const m=await api('me?'+key());
  if(m.error==='auth')return dead();
  if(m.error)return;
  FC=m.friends.length;
  $('#fl').innerHTML=m.friends.map(f=>`<div class="item">${esc(f.name)}</div>`).join('')||'<span style="opacity:.5">No friends yet. Search for a name below.</span>';
  $('#rxl').innerHTML=(m.reacts||[]).map(x=>`<div class="item"><span>${esc(x.name)} reacted</span><button onclick="playRx('${x.rid}')">Watch once</button></div>`).join('')||'<span style="opacity:.5">No reactions yet</span>';
  $('#inb').innerHTML=m.inbox.map(v=>`<div class="item"><span>${esc(v.name)} · ${fmt(v.left)} left${v.seen?' · watched':''}</span><button onclick="watch('${v.vid}')">${v.seen?'Replay':'Watch'}</button></div>`).join('')||'<span style="opacity:.5">Nothing new</span>';
  const n=m.inbox.filter(v=>!v.seen).length+(m.reacts||[]).length;
  document.title=n?`(${n}) Raw`:'Raw';
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st;$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(async()=>{
  const q=e.target.value.trim();
  const r=await api('search?'+key()+'&q='+encodeURIComponent(q));
  $('#res').innerHTML=r.map(u=>`<div class="item">${esc(u.name)}<button onclick="add('${u.id}')">Add</button></div>`).join('')||'<span style="opacity:.5">No one found</span>';
},250)};
$('#q').onfocus=()=>$('#q').dispatchEvent(new Event('input'));
async function add(id){await api('add?'+key()+'&id='+id);$('#q').value='';$('#res').innerHTML='';refresh()}
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#invtxt').textContent);$('#copy').textContent='Copied'}catch(e){prompt('Copy:',$('#invtxt').textContent)}setTimeout(()=>$('#copy').textContent='Copy link',1500)};

function watch(vid){pend=vid;$('#pre').classList.add('on')}
async function rxOpen(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    return await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
  }catch(e){return null}
}
function rxStart(rs){
  const type=MediaRecorder.isTypeSupported('video/webm')?'video/webm':'video/mp4';
  const m=new MediaRecorder(rs,{mimeType:type,videoBitsPerSecond:1000000});
  m.ch=[];m.rtype=type;m.ondataavailable=e=>e.data.size&&m.ch.push(e.data);
  m.start();return m;
}
const rxStop=m=>new Promise(res=>{m.onstop=()=>res(new Blob(m.ch,{type:m.rtype}));m.stop()});
function rxReview(clip,vid){
  RXC={blob:clip,vid:vid};$('#rvm').textContent='';
  const v=$('#rvv');v.src=URL.createObjectURL(clip);
  $('#rv').classList.add('on');v.play().catch(()=>{});
}
function rxclose(){
  const v=$('#rvv');v.pause();if(v.src)URL.revokeObjectURL(v.src);v.removeAttribute('src');
  RXC=null;$('#rv').classList.remove('on');
}
$('#rvx').onclick=rxclose;
$('#rvs').onclick=async()=>{
  if(!RXC)return;
  $('#rvm').textContent='Sending…';
  const r=await fetch('/api/react?'+key()+'&vid='+RXC.vid,{method:'POST',headers:{'Content-Type':RXC.blob.type},body:RXC.blob}).then(r=>r.json()).catch(()=>({}));
  if(r.error==='auth')return dead();
  if(!r.ok){$('#rvm').textContent=r.error==='already sent'?'Already sent':'Try again';return}
  rxclose();
};
async function play(vid){
  const r=await fetch('/api/watch?'+key()+'&vid='+vid);
  if(!r.ok)return refresh();
  const dur=+(r.headers.get('X-Dur')||0);
  const url=URL.createObjectURL(await r.blob()),v=$('#view video');
  const rs=RX?await rxOpen():null; // viewer's front camera, only when reaction is on
  let m=null,done=false;
  v.src=url;$('#view').style.display='block';
  v.ontimeupdate=()=>{ // start recording when the last 5 seconds begin
    if(!rs||m)return;
    const d=dur||(isFinite(v.duration)?v.duration:0);
    if(v.currentTime>=Math.max(0,d-5))m=rxStart(rs);
  };
  v.play();
  async function close(keep){
    if(done)return;done=true;
    v.ontimeupdate=null;v.pause();v.removeAttribute('src');URL.revokeObjectURL(url);
    $('#view').style.display='none';
    let clip=null;
    if(m){const b=await rxStop(m);if(keep)clip=b}
    if(rs){rs.getTracks().forEach(t=>t.stop());startCam()}
    refresh();
    if(clip)rxReview(clip,vid);
  }
  v.onended=()=>close(true);$('#view').onclick=()=>close(false);
}
async function playRx(rid){ // a friend's reaction: watch once, then it is gone
  const r=await fetch('/api/react_watch?'+key()+'&rid='+rid);
  if(!r.ok)return refresh();
  const url=URL.createObjectURL(await r.blob()),v=$('#view video');
  v.ontimeupdate=null;v.src=url;$('#view').style.display='block';v.play();
  const close=()=>{v.pause();v.removeAttribute('src');URL.revokeObjectURL(url);$('#view').style.display='none';refresh()};
  v.onended=close;$('#view').onclick=close;
}
function rxui(){$('#rx1').classList.toggle('on',RX);$('#rx0').classList.toggle('on',!RX)}
$('#rx1').onclick=()=>{RX=true;localStorage.setItem('rx','1');rxui()};
$('#rx0').onclick=()=>{RX=false;localStorage.setItem('rx','0');rxui()};
$('#no').onclick=()=>$('#pre').classList.remove('on');
$('#go').onclick=()=>{$('#pre').classList.remove('on');play(pend)};
rxui();
boot();
</script></body></html>
